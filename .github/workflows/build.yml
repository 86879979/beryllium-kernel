name: Build beryllium kernel

on:
  workflow_dispatch:

env:
  KERNEL_REPO: "https://github.com/Strix-Vyxlor/android_kernel_xiaomi_sdm845"
  KERNEL_BRANCH: "lineage-21"
  DEFCONFIG: ""
  CLANG_BRANCH: "android12-release"
  CLANG_DIR: "clang-r416183b"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for extra.config)
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev make \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            zip git python3 cpio

      - name: Get kernel source
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" \
            "$KERNEL_REPO" kernel

      - name: Get clang
        run: |
          git clone --depth=1 -b "$CLANG_BRANCH" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang-all

          test -x "$GITHUB_WORKSPACE/clang-all/$CLANG_DIR/bin/clang"
          echo "$GITHUB_WORKSPACE/clang-all/$CLANG_DIR/bin" >> "$GITHUB_PATH"

      - name: Configure
        working-directory: kernel
        run: |
          set -e

          if [ -s ../device.config ]; then
            mkdir -p out
            cp ../device.config out/.config
          elif [ -n "$DEFCONFIG" ]; then
            make O=out ARCH=arm64 CC=clang "$DEFCONFIG"
          else
            echo "ERROR: Upload device.config or set DEFCONFIG"
            exit 1
          fi

          if [ -s ../extra.config ]; then
            ARCH=arm64 scripts/kconfig/merge_config.sh \
              -m -O out out/.config ../extra.config
          fi

          scripts/config --file out/.config --disable COMPAT_VDSO
          scripts/config --file out/.config --disable LOCALVERSION_AUTO
          scripts/config --file out/.config \
            --set-str LOCALVERSION "-g56f4118d056c-dirty"

          make O=out ARCH=arm64 CC=clang LOCALVERSION= olddefconfig

          # تأكد إن كل خيار في extra.config دخل فعلاً في الـ config النهائي
          : > ../config-check.txt
          if [ -s ../extra.config ]; then
            grep -E '^CONFIG_[A-Za-z0-9_]+=' ../extra.config | while IFS='=' read -r k v; do
              if grep -qx "$k=$v" out/.config; then
                echo "OK      $k=$v" >> ../config-check.txt
              else
                echo "DROPPED $k=$v" >> ../config-check.txt
              fi
            done
          fi
          echo "=== extra.config check ==="
          cat ../config-check.txt

      - name: Build kernel
        working-directory: kernel
        run: |
          set -o pipefail

          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LOCALVERSION= \
            KCFLAGS="-Wno-error" 2>&1 | tee ../build.log

          ls -lh out/arch/arm64/boot/

          # لازم يطابق النواة الأصلية بالظبط (بدون علامة +) وإلا modules الجهاز مش هتتحمّل
          REL="$(cat out/include/config/kernel.release)"
          echo "Kernel release: $REL"
          if [ "$REL" != "4.9.337-g56f4118d056c-dirty" ]; then
            echo "ERROR: release mismatch: $REL"
            exit 1
          fi

      - name: Build RTL8188EUS module (TP-Link v2)
        continue-on-error: true
        run: |
          set -uo pipefail

          if ! git clone --depth=1 -b v5.3.9 \
            https://github.com/aircrack-ng/rtl8188eus drv; then
            echo "ERROR: Driver source clone failed" | tee module.log
            exit 0
          fi

          # clang 12 مش بيعرف بعض خيارات gcc في Makefile الدرايفر
          find drv -type f \( -name Makefile -o -name Kbuild -o -name '*.mk' \) \
            -exec sed -i 's/-Wno-cast-function-type//g; s/-Werror//g' {} +

          # نواة 4.9 هنا فيها واجهة cfg80211_roamed الجديدة (backport من 4.12)،
          # بس الدرايفر بيشوف إنها 4.9 فبيستخدم الواجهة القديمة
          echo "=== 4.12 version gates before ===" | tee -a module.log
          grep -nE "KERNEL_VERSION\(4, ?12, ?0\)" drv/os_dep/linux/ioctl_cfg80211.c | tee -a module.log || true
          # بنغيّر بس بوابات (>= 4.12)؛ بوابات (< 4.12) لازم تفضل زي ما هي
          # لأن نواتك لسه فيها الشكل القديم لـ change_virtual_intf (مع معامل flags)
          sed -i -E 's/>= KERNEL_VERSION\(4, ?12, ?0\)/>= KERNEL_VERSION(4, 9, 0)/g' drv/os_dep/linux/ioctl_cfg80211.c
          echo "=== 4.12 gates after ===" | tee -a module.log
          grep -nE "KERNEL_VERSION\(4, ?(9|12), ?0\)" drv/os_dep/linux/ioctl_cfg80211.c | tee -a module.log || true

          # arm64 little-endian instead of the x86 defaults
          sed -i 's/^CONFIG_PLATFORM_I386_PC *=.*/CONFIG_PLATFORM_I386_PC = n/' drv/Makefile
          sed -i 's/^CONFIG_PLATFORM_ARM64_RPI *=.*/CONFIG_PLATFORM_ARM64_RPI = y/' drv/Makefile

          {
            echo "=== Kernel release ==="
            cat kernel/out/include/config/kernel.release
            echo "=== Platform options in Makefile ==="
            grep -nE '^CONFIG_PLATFORM_(I386_PC|ARM64_RPI)' drv/Makefile || true
          } | tee -a module.log

          # CONFIG_RTL8188EU=m is required: calling the kernel make directly
          # skips the driver's own wrapper, so the module would be "0 modules"
          make -C "$GITHUB_WORKSPACE/kernel" \
            O="$GITHUB_WORKSPACE/kernel/out" \
            ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LOCALVERSION= \
            KCFLAGS="-Wno-error -Wno-unknown-warning-option" \
            M="$GITHUB_WORKSPACE/drv" \
            CONFIG_RTL8188EU=m \
            modules 2>&1 | tee -a module.log

          cp drv/8188eu.ko 8188eu.ko
          echo "=== modinfo-like check ===" | tee -a module.log
          strings 8188eu.ko | grep -E '^(vermagic|depends)=' | tee -a module.log

      - name: Upload module logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8188eus-log
          path: module.log
          if-no-files-found: warn

      - name: Package with AnyKernel3
        run: |
          set -e

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3 ak3

          test -s kernel/out/arch/arm64/boot/Image.gz-dtb

          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/

          sed -i \
            's/^do.devicecheck=.*/do.devicecheck=1/; s/^device.name1=.*/device.name1=beryllium/; s/^is_slot_device=.*/is_slot_device=0;/' \
            ak3/anykernel.sh

          sed -i \
            's|^block=.*|block=/dev/block/bootdevice/by-name/boot;|' \
            ak3/anykernel.sh

          # AnyKernel3 الحديث بيستخدم حروف كبيرة (BLOCK / IS_SLOT_DEVICE)
          sed -i \
            's|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|; s|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=0;|' \
            ak3/anykernel.sh

          echo "=== anykernel.sh settings ==="
          grep -niE '^(block|is_slot_device|device\.name1|do\.devicecheck)=' ak3/anykernel.sh
          grep -q '^BLOCK=/dev/block/bootdevice/by-name/boot;' ak3/anykernel.sh \
            || grep -q '^block=/dev/block/bootdevice/by-name/boot;' ak3/anykernel.sh \
            || { echo "ERROR: boot block path not set"; exit 1; }

          cd ak3
          zip -r9 ../beryllium-kernel.zip . -x '.git*' '*.md'

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: beryllium-kernel
          path: beryllium-kernel.zip

      - name: Upload module (if built)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8188eu-module
          path: 8188eu.ko
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            config-check.txt
          if-no-files-found: warn
